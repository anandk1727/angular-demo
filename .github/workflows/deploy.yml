name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time. a newer push cancels an in-progress one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:ci

      # Project sites are served from /<repo>/, not /
      - run: pnpm ng build --base-href /angular-demo/

      # GitHub Pages serves 404.html for unknown paths, so deep links like /contact-us load the app
      - run: cp dist/angular-demo/browser/index.html dist/angular-demo/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/angular-demo/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
